<svg width="1440" height="795" viewBox="0 0 1440 795" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="795" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5f7fb"/>
      <stop offset="100%" stop-color="#e4e8f0"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1868f0"/>
      <stop offset="100%" stop-color="#124fb8"/>
    </linearGradient>
    <linearGradient id="nodeDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12172b"/>
      <stop offset="100%" stop-color="#1a2550"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="795" fill="url(#bg)"/>

  <!-- connecting lines between agent nodes -->
  <g stroke="#1868f0" stroke-width="2" opacity="0.25">
    <line x1="260" y1="300" x2="520" y2="180"/>
    <line x1="260" y1="300" x2="470" y2="470"/>
    <line x1="520" y1="180" x2="820" y2="230"/>
    <line x1="470" y1="470" x2="820" y2="230"/>
    <line x1="820" y1="230" x2="1100" y2="150"/>
    <line x1="820" y1="230" x2="1080" y2="420"/>
    <line x1="470" y1="470" x2="760" y2="580"/>
    <line x1="760" y1="580" x2="1080" y2="420"/>
    <line x1="1080" y1="420" x2="1250" y2="300"/>
  </g>

  <!-- agent nodes -->
  <circle cx="260" cy="300" r="26" fill="url(#node)"/>
  <circle cx="520" cy="180" r="18" fill="url(#node)" opacity="0.85"/>
  <circle cx="470" cy="470" r="34" fill="url(#nodeDark)"/>
  <circle cx="820" cy="230" r="44" fill="url(#node)"/>
  <circle cx="1100" cy="150" r="20" fill="url(#node)" opacity="0.8"/>
  <circle cx="1080" cy="420" r="30" fill="url(#nodeDark)"/>
  <circle cx="760" cy="580" r="22" fill="url(#node)" opacity="0.85"/>
  <circle cx="1250" cy="300" r="16" fill="url(#node)" opacity="0.7"/>

  <!-- small satellite dots for texture -->
  <g fill="#1868f0" opacity="0.35">
    <circle cx="180" cy="180" r="6"/>
    <circle cx="1300" cy="500" r="6"/>
    <circle cx="620" cy="650" r="5"/>
    <circle cx="1000" cy="600" r="5"/>
    <circle cx="360" cy="560" r="4"/>
  </g>

  <!-- central label plate -->
  <rect x="560" y="330" width="320" height="120" rx="16" fill="#ffffff" opacity="0.9"/>
  <text x="720" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#12172b" text-anchor="middle">Multi-Agent</text>
  <text x="720" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1868f0" text-anchor="middle">R&amp;D Assistant</text>
</svg>
